<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>try{var _t=localStorage.getItem('cv-theme');if(_t&&(_t==='light'||_t==='dark'||_t==='light dark'))document.querySelector('meta[name="color-scheme"]').content=_t}catch(e){}</script>
<title>Context Vault · Token 经济面板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1.5' y='1.5' width='21' height='21' rx='3' fill='%2316181c'/%3E%3Cpath d='M7 4.8H18a1 1 0 0 1 1 1V7.9H9.3a.8.8 0 0 0-.8.8v6.6a.8.8 0 0 0 .8.8H19v2.1a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V6.8a2 2 0 0 1 2-2Z' fill='%23ffffff'/%3E%3Crect x='10.8' y='10.2' width='8.2' height='3.6' rx='.7' fill='%23e1251b'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg-canvas:light-dark(#f4f4f2,#18191b);
  --bg-surface:light-dark(#ffffff,#202225);
  --bg-subtle:light-dark(#f8f8f6,#272a2e);
  --bg-inset:light-dark(#ecece8,#2f3338);
  --line:light-dark(#d4d4d0,#383c42);
  --line-soft:light-dark(#e6e6e2,#2c3035);
  --line-strong:light-dark(#111111,#d4d6d8);
  --ink:light-dark(#0a0a0a,#ededeb);
  --ink-2:light-dark(#333333,#b8bcc2);
  --ink-3:light-dark(#666662,#9aa0a8);
  --acc:#e1251b;
  --acc-ink:light-dark(#c81e14,#ff645a);
  --link:light-dark(#1d5bbf,#6ea8fe);
  --ok:light-dark(#157a3f,#3fb950);
  --warn:light-dark(#9a5200,#f5b027);
  --err:light-dark(#990f0f,#ff7070);
  --cv-rim:light-dark(transparent,#424852);
  --rad-s:2px;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"SF Mono",ui-monospace,monospace;
}
:root:has(> head > meta[name="color-scheme"][content="dark"]){color-scheme:dark}
:root:has(> head > meta[name="color-scheme"][content="light"]){color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg-canvas);color:var(--ink);
  font:13.5px/1.58 "Helvetica Neue","Inter","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  padding:28px 24px 56px;
}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:var(--rad-s)}
svg{flex:none;display:block}
.cv-mark .cv-rim{stroke:var(--cv-rim)}
.shell{max-width:1280px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 16px;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.head-l{display:flex;align-items:center;gap:10px;min-width:0}
.head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--ink-3);font-size:12.5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--link);text-decoration:none;
  border:1px solid var(--line);border-radius:var(--rad-s);padding:4px 10px;background:var(--bg-surface);white-space:nowrap}
.back:hover{border-color:var(--line-strong);background:var(--bg-subtle)}
.theme-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--bg-subtle);
  border:1px solid var(--line);border-radius:var(--rad-s);padding:2px}
.theme-sw button{background:none;border:none;color:var(--ink-3);font-size:11.5px;padding:3px 8px;
  border-radius:var(--rad-s);cursor:pointer;font-family:inherit;white-space:nowrap}
.theme-sw button:hover{color:var(--ink)}
.theme-sw button[aria-pressed="true"]{background:var(--bg-surface);color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:24px}
.card{
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--rad-s);
  padding:16px 18px;
}
.card .v{font:650 23px/1.2 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:4px}
.card.alt .v{color:var(--ink)}
.card .k{color:var(--ink-3);font-size:12px}
section.panel{
  background:var(--bg-surface);border:1px solid var(--line);border-radius:var(--rad-s);
  padding:16px 18px;margin-bottom:16px;
}
h2{font-size:13.5px;font-weight:650;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.bar{display:flex;align-items:center;gap:12px;margin:8px 0}
.bar .name{width:220px;color:var(--ink-2);font:12px/1.4 var(--mono);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;background:var(--bg-inset);border:1px solid var(--line-soft);border-radius:var(--rad-s);height:16px;overflow:hidden}
.bar .fill{height:100%;border-radius:var(--rad-s);background:var(--acc)}
.bar .val{width:170px;font:12px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.months{display:flex;align-items:flex-end;gap:8px;height:128px;padding-top:8px}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.mcol .stick{width:100%;max-width:44px;background:var(--acc);opacity:.88;border-radius:var(--rad-s) var(--rad-s) 0 0}
.mcol .lb{font:11px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-3)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
th{background:var(--bg-subtle);color:var(--ink-3);font-weight:600;font-size:12px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--bg-subtle)}
td:first-child{font-family:var(--mono);color:var(--link)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.ok{background:var(--ok)} .err{background:var(--err)} .warm{background:var(--warn)}
@media(max-width:700px){
  body{padding:16px 12px 40px}
  .bar{flex-wrap:wrap;gap:4px}
  .bar .name,.bar .val{width:100%;text-align:left}
}
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div class="head-l">
      <svg class="cv-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect class="cv-rim" x="1.5" y="1.5" width="21" height="21" rx="3" fill="#16181c" stroke-width="0.8"/>
        <path d="M7 4.8H18a1 1 0 0 1 1 1V7.9H9.3a.8.8 0 0 0-.8.8v6.6a.8.8 0 0 0 .8.8H19v2.1a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V6.8a2 2 0 0 1 2-2Z" fill="#ffffff"/>
        <rect x="10.8" y="10.2" width="8.2" height="3.6" rx="0.7" fill="#e1251b"/>
      </svg>
      <div>
        <h1>Context Vault · Token 经济面板</h1>
        <div class="sub">本地优先资产账本 · 生成于 __GENERATED__</div>
      </div>
    </div>
    <div class="head-r">
      <div class="theme-sw" role="group" aria-label="界面主题">
        <button type="button" data-theme="light dark" aria-pressed="true">跟随</button>
        <button type="button" data-theme="light" aria-pressed="false">浅色</button>
        <button type="button" data-theme="dark" aria-pressed="false">深色</button>
      </div>
      <a class="back" href="/">← 返回控制台</a>
    </div>
  </header>
  <div class="cards">__CARDS__</div>
  <section class="panel">
    <h2>按模型节省明细</h2>
    __BYMODEL__
  </section>
  <section class="panel">
    <h2>月度节省走势（__MONTHS__ 个月）</h2>
    <div class="months">__TIMELINE__</div>
  </section>
  <section class="panel">
    <h2>上游可用性（最近探测 / 切换）</h2>
    <div class="tbl-wrap"><table><thead><tr><th scope="col">状态灯</th><th scope="col">时间</th><th scope="col">Profile</th><th scope="col">状态</th><th scope="col">详情</th></tr></thead><tbody>__PROBE__</tbody></table></div>
  </section>
  <section class="panel">
    <h2>Vault 快照资产（最近 __NSNAP__ 条）</h2>
    <div class="tbl-wrap"><table><thead><tr><th scope="col">ID</th><th scope="col">Agent</th><th scope="col">块数</th><th scope="col">输入 Token</th><th scope="col">Cache 读</th><th scope="col">完整性</th><th scope="col">时间</th></tr></thead><tbody>__SNAPS__</tbody></table></div>
  </section>
</div>
<script>
(function(){
  var K='cv-theme',m=document.querySelector('meta[name="color-scheme"]'),bs=[].slice.call(document.querySelectorAll('.theme-sw button'));
  function ap(v){if(m)m.setAttribute('content',v);bs.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.theme===v))});}
  bs.forEach(function(b){b.addEventListener('click',function(){var v=b.dataset.theme;try{if(v==='light dark')localStorage.removeItem(K);else localStorage.setItem(K,v)}catch(e){}ap(v)})});
  try{ap(localStorage.getItem(K)||'light dark')}catch(e){ap('light dark')}
})();
</script>
</body>
</html>
