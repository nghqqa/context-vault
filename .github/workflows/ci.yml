name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest setuptools wheel
      - run: python -m pytest tests/ -v
      - name: console JS syntax + runtime check (内嵌脚本崩一则整页失灵)
        run: |
          python tools/check_console_js.py emit
          node --check console_check.js
          python tools/check_console_js.py run
          node console_run.js  # mock 已替全部定时器, 正常执行即退出 0; 崩溃(非 0)即失败 (Windows pwsh 下禁用 bash 语法, 见 f96c91c 教训)
          python tools/check_console_js.py unit
          node console_unit.js  # 带数据的函数级回归: B03 token 清理 / B04 loadOv / B06 搜索空态
      - name: console layout probe (真实 Chromium 多视口溢出探测, 管 node 检查管不到的 CSS 级联)
        if: matrix.python == '3.12'
        shell: bash
        run: |
          pip install playwright
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
          python tools/check_console_overflow.py
      - name: stdlib-only check (引擎零第三方依赖)
        run: python -c "import sys; sys.path.insert(0, 'tools'); import cv, cv_core, cv_index, cv_rank, cv_memory, cv_ledger, cv_ledger_cli, cv_ledger_collect, cv_mcp, cv_sync, cv_semantic, cv_skills, cv_skills_ops, cv_migrate, cv_ops, cv_export, cv_projects, cv_antigravity, cv_antigravity_pb, cv_dsh, cv_dsh_codec, cv_server, cv_ui, mcp_server, aml_adapter, antigravity_batch; print('engine imports OK, zero third-party deps')"
      - name: package smoke test (pyproject 完整性与 UI 资源加载校验)
        run: |
          pip install --no-build-isolation --no-deps .
          cv --version
          python -c "import cv_ui; html = cv_ui.load_console_html(); assert len(html) > 1000, 'console html empty'; print('package smoke OK')"
