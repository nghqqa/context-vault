name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests/ -v
      - name: console JS syntax + runtime check (内嵌脚本崩一则整页失灵)
        run: |
          python tools/check_console_js.py emit
          node --check console_check.js
          python tools/check_console_js.py run
          node console_run.js  # mock 已替全部定时器, 正常执行即退出 0; 崩溃(非 0)即失败 (Windows pwsh 下禁用 bash 语法, 见 f96c91c 教训)
      - name: stdlib-only check (引擎零第三方依赖)
        run: python -c "import sys; sys.path.insert(0, 'tools'); import cv, mcp_server; print('engine imports OK, zero third-party deps')"
