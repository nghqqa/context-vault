name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests/ -v
      - name: console JS syntax check (内嵌脚本崩一则整页失灵)
        run: |
          python -c "import re; src=open('tools/cv.py',encoding='utf-8').read(); html=re.search(r'CONSOLE_HTML = r?\"\"\"(.*?)\"\"\"',src,re.S).group(1); open('console_check.js','w',encoding='utf-8').write(re.search(r'<script>(.*)</script>',html,re.S).group(1))"
          node --check console_check.js
      - name: stdlib-only check (引擎零第三方依赖)
        run: python -c "import sys; sys.path.insert(0, 'tools'); import cv, mcp_server; print('engine imports OK, zero third-party deps')"
